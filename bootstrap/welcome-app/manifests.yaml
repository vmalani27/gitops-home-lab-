apiVersion: v1
kind: Namespace
metadata:
  name: welcome-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: welcome-app
  namespace: welcome-app
  labels:
    app: welcome-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: welcome-app
  template:
    metadata:
      labels:
        app: welcome-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 20m
            memory: 32Mi
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: welcome-html
---
apiVersion: v1
kind: Service
metadata:
  name: welcome-app-svc
  namespace: welcome-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: welcome-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: welcome-app-ingress
  namespace: welcome-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - links.test
    secretName: wildcard-links-test-tls
  rules:
  - host: links.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: welcome-app-svc
            port:
              number: 80
